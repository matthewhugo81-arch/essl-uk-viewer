<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESSL UK Storm Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.bar{display:flex;gap:7px;overflow-x:auto;padding:8px;background:#0f172a;border-bottom:1px solid #253044;position:sticky;top:0;z-index:20}
button,a{white-space:nowrap;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#e5e7eb;padding:9px 11px;font-size:14px;text-decoration:none}
button.primary{background:#2563eb;border-color:#60a5fa;font-weight:700}
.viewer{height:calc(100vh - 52px);background:#dbe3ee}
iframe{width:100%;height:100%;border:0;background:white}
</style>
</head>
<body>

<div class="bar">
  <a class="primary" href="https://weather.essl.org/storm/" target="esslFrame">ESSL Storm</a>
  <a href="https://weather.essl.org/storm/" target="_blank" rel="noopener">Open full site</a>
</div>

<div class="viewer">
  <iframe name="esslFrame" src="https://weather.essl.org/storm/"></iframe>
</div>

</body>
</html>
