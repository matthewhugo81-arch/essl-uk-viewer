<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESSL UK Storm Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.bar{display:flex;gap:7px;overflow-x:auto;padding:8px;background:#0f172a;border-bottom:1px solid #253044;position:sticky;top:0;z-index:30}
button,a,select{white-space:nowrap;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#e5e7eb;padding:9px 11px;font-size:14px;text-decoration:none}
button.active,.primary{background:#2563eb;border-color:#60a5fa;font-weight:700}
.title{background:#1f2937;color:#fff;padding:7px 10px;font-size:13px}
.viewer{height:calc(100vh - 88px);overflow:hidden;background:#dbe3ee;position:relative}
.mapbox{position:relative;width:100%;height:100%;overflow:hidden;background:#e5e7eb}
#mapImg{position:absolute;left:0;top:0;width:1400px;height:auto;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
.stamp{position:absolute;top:12px;left:12px;background:rgba(15,23,42,.84);border:1px solid rgba(255,255,255,.5);border-radius:10px;color:#fff;padding:10px 12px;font-size:13px;line-height:1.35;z-index:8;min-width:245px}
.stamp b{font-size:14px}
.fallback{display:none;position:absolute;left:16px;right:16px;top:120px;padding:14px;color:#111;background:white;border-radius:10px;z-index:9}.fallback a{color:#1d4ed8}
@media(max-width:800px){
  .viewer{height:calc(100vh - 86px)}
  button,a,select{font-size:14px;padding:9px 10px}
  #mapImg{width:1350px}
  .stamp{font-size:12px;min-width:230px}
}
</style>
</head>
<body>

<div class="bar">
  <button class="primary" onclick="resetUK()">UK view</button>
  <button onclick="stepFrame(-1)">◀ -3h</button>
  <select id="frameSelect" onchange="setFrame(this.value)"></select>
  <button onclick="stepFrame(1)">+3h ▶</button>
  <button id="loopBtn" onclick="toggleLoop()">▶ Loop</button>
  <button onclick="zoom(1.12)">Zoom +</button>
  <button onclick="zoom(0.89)">Zoom -</button>
  <button onclick="pan(-35,0)">◀</button>
  <button onclick="pan(35,0)">▶</button>
  <button onclick="pan(0,-35)">▲</button>
  <button onclick="pan(0,35)">▼</button>
  <button onclick="detectLatestRun()">Update run</button>
  <a id="open" href="#" target="_blank" rel="noopener">Full image</a>
</div>

<div class="title" id="title">Detecting latest ESSL run...</div>

<div class="viewer">
  <div class="mapbox" id="mapbox">
    <img id="mapImg" alt="ESSL map">
    <div class="stamp" id="stamp"></div>
    <div class="fallback" id="fallback">Image did not load. Tap <a id="fallbackLink" target="_blank" rel="noopener">Full image</a>.</div>
  </div>
</div>

<script>
const base='https://weather.essl.org/storm/map_images/models/archamos/';
let run=null;
let frames=[];
let frameIndex=0;
let view=JSON.parse(localStorage.getItem('essl_view')||'null') || {scale:1.35,x:-180,y:-90};

function pad(n){return String(n).padStart(2,'0');}
function ymdh(dt){return dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+pad(dt.getUTCHours());}
function addHours(yyyymmddhh,h){
  const y=+yyyymmddhh.slice(0,4),m=+yyyymmddhh.slice(4,6)-1,d=+yyyymmddhh.slice(6,8),hr=+yyyymmddhh.slice(8,10);
  return ymdh(new Date(Date.UTC(y,m,d,hr+h)));
}
function fmt(t){
  const y=t.slice(0,4),m=t.slice(4,6),d=t.slice(6,8),h=t.slice(8,10);
  return d+'/'+m+'/'+y+' '+h+'Z';
}
function imgUrl(r=run,valid=frames[frameIndex]){
  const yyyymm=r.slice(0,6);
  return base+yyyymm+'/'+r+'/combi_paramcombi3_'+r+'_'+valid+'.png';
}
function testImage(url){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(true);
    img.onerror=()=>resolve(false);
    img.src=url+'?probe='+Date.now();
  });
}
function candidateRuns(){
  const now=new Date();
  const out=[];
  for(let back=0;back<=7;back++){
    const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-back,0));
    out.push(ymdh(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12))));
    out.push(ymdh(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0))));
  }
  return out;
}
async function detectLatestRun(){
  document.getElementById('title').textContent='Checking latest available ESSL run...';
  document.getElementById('stamp').innerHTML='<b>ESSL AR-CHaMo</b><br>Checking latest run...';

  for(const r of candidateRuns()){
    const firstValid=addHours(r,3);
    const testUrl=base+r.slice(0,6)+'/'+r+'/combi_paramcombi3_'+r+'_'+firstValid+'.png';
    const ok=await testImage(testUrl);
    if(ok){
      run=r;
      frames=[];
      for(let h=3;h<=72;h+=3) frames.push(addHours(run,h));
      frameIndex=0;
      populateFrameSelect();
      refresh();
      return;
    }
  }

  document.getElementById('title').textContent='No recent ESSL run found.';
  document.getElementById('fallback').style.display='block';
}
function populateFrameSelect(){
  const sel=document.getElementById('frameSelect');
  sel.innerHTML='';
  frames.forEach((f,i)=>{
    const o=document.createElement('option');
    o.value=String(i);
    o.textContent=fmt(f);
    sel.appendChild(o);
  });
}
function applyView(){
  document.getElementById('mapImg').style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.scale+')';
  localStorage.setItem('essl_view',JSON.stringify(view));
}
function refresh(){
  if(!run || !frames.length)return;
  const url=imgUrl();
  const valid=frames[frameIndex];

  document.getElementById('title').textContent='ESSL 3-hour probability of large hail and lightning - valid '+fmt(valid);
  document.getElementById('open').href=url;
  document.getElementById('fallbackLink').href=url;
  document.getElementById('frameSelect').value=String(frameIndex);

  const img=document.getElementById('mapImg');
  document.getElementById('fallback').style.display='none';
  img.onload=()=>{document.getElementById('fallback').style.display='none';};
  img.onerror=()=>{document.getElementById('fallback').style.display='block';};
  img.src=url+'?t='+Date.now();

  document.getElementById('stamp').innerHTML=
    '<b>ESSL AR-CHaMo</b><br>'+
    'Product: Large hail + lightning 3h<br>'+
    'Run: '+fmt(run)+'<br>'+
    'Valid: '+fmt(valid);

  applyView();
}
function setFrame(v){frameIndex=Number(v);refresh();}
function stepFrame(delta){
  const next=frameIndex+delta;
  if(next<0||next>=frames.length)return;
  frameIndex=next;
  refresh();
}
function resetUK(){view={scale:1.35,x:-180,y:-90};applyView();}
function pan(dx,dy){view.x+=dx;view.y+=dy;applyView();}
function zoom(factor){
  const box=document.getElementById('mapbox');
  const cx=box.clientWidth/2,cy=box.clientHeight/2;
  view.x=cx-(cx-view.x)*factor;
  view.y=cy-(cy-view.y)*factor;
  view.scale*=factor;
  applyView();
}
let loopTimer=null;
function toggleLoop(){
  const btn=document.getElementById('loopBtn');
  if(loopTimer){
    clearInterval(loopTimer);
    loopTimer=null;
    btn.textContent='▶ Loop';
    btn.classList.remove('active');
    return;
  }
  btn.textContent='■ Stop';
  btn.classList.add('active');
  loopTimer=setInterval(()=>{
    frameIndex=(frameIndex+1)%frames.length;
    refresh();
  },800);
}
detectLatestRun();
</script>

</body>
</html>
